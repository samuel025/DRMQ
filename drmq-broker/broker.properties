# DRMQ Broker Configuration
node.id=broker1
port=9092
data.dir=./data-1

# Comma-separated list of peer brokers (e.g., broker2:localhost:9093,broker3:localhost:9094)
# Leave empty or comment out for single-node (standalone) mode
peers=

# Storage & Compaction
log.segment.bytes=104857600
log.retention.ms=604800000
log.segment.fsync=true
raft.compact.threshold=500

# Delivery Guarantees
max.deliveries=5
dlq.topic.prefix=dlq.

# Telemetry
metrics.enabled=true
metrics.port=9096
metrics.path=/metrics

# InfinityLog (Transparent Tiered Storage)
# s3.archive.bucket=my-archive-bucket
# s3.archive.region=us-east-1
# s3.archive.endpoint=http://localhost:9000
